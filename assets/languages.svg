<svg xmlns="http://www.w3.org/2000/svg" width="495" height="235" viewBox="0 0 495 235" role="img" aria-label="Languages by public repository">
  <title>Languages by public repository</title>
  <style>
    :root { --bg:#ffffff; --border:#d0d7de; --text:#1f2328; --muted:#59636e; --accent:#0969da; --track:#eff2f5;
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --border:#30363d; --text:#e6edf3; --muted:#9198a1; --accent:#58a6ff; --track:#21262d;
    }
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .bg { fill:var(--bg); stroke:var(--border); }
    .title { font-size:16px; font-weight:600; fill:var(--text); }
    .value { font-size:24px; font-weight:700; fill:var(--accent); }
    .label { font-size:12px; fill:var(--muted); }
    .body { font-size:13px; fill:var(--text); }</style>
  <rect class="bg" x=".5" y=".5" width="494" height="234" rx="10"/>
  <text class="title" x="24" y="34">Languages by public repo</text>
  <clipPath id="c"><rect x="24" y="50" width="447" height="10" rx="5"/></clipPath>
  <g clip-path="url(#c)"><rect x="24.0" y="50" width="143.7" height="10" fill="#00b4ab"/><rect x="167.7" y="50" width="95.8" height="10" fill="#b07219"/><rect x="263.5" y="50" width="63.9" height="10" fill="#f1e05a"/><rect x="327.3" y="50" width="31.9" height="10" fill="#3178c6"/><rect x="359.3" y="50" width="31.9" height="10" fill="#da5b0b"/><rect x="391.2" y="50" width="31.9" height="10" fill="#a97bff"/><rect x="423.1" y="50" width="47.9" height="10" fill="#8b949e"/></g>
  <g><circle cx="29" cy="88" r="5" fill="#00b4ab"/><text class="body" x="42" y="92">Dart</text><text class="label" x="199" y="92" text-anchor="end">9 repos</text></g>
  <g><circle cx="259" cy="88" r="5" fill="#b07219"/><text class="body" x="272" y="92">Java</text><text class="label" x="429" y="92" text-anchor="end">6 repos</text></g>
  <g><circle cx="29" cy="120" r="5" fill="#f1e05a"/><text class="body" x="42" y="124">JavaScript</text><text class="label" x="199" y="124" text-anchor="end">4 repos</text></g>
  <g><circle cx="259" cy="120" r="5" fill="#3178c6"/><text class="body" x="272" y="124">TypeScript</text><text class="label" x="429" y="124" text-anchor="end">2 repos</text></g>
  <g><circle cx="29" cy="152" r="5" fill="#da5b0b"/><text class="body" x="42" y="156">Jupyter Notebook</text><text class="label" x="199" y="156" text-anchor="end">2 repos</text></g>
  <g><circle cx="259" cy="152" r="5" fill="#a97bff"/><text class="body" x="272" y="156">Kotlin</text><text class="label" x="429" y="156" text-anchor="end">2 repos</text></g>
  <g><circle cx="29" cy="184" r="5" fill="#8b949e"/><text class="body" x="42" y="188">Other</text><text class="label" x="199" y="188" text-anchor="end">3 repos</text></g>
</svg>
