<svg xmlns="http://www.w3.org/2000/svg" width="440" height="136" viewBox="0 0 440 136" role="img" aria-label="OPE">
  <title>OPE</title>
  <style>
    :root { --bg:#ffffff; --border:#d0d7de; --text:#1f2328; --muted:#59636e; --accent:#0969da; --track:#eff2f5;
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --border:#30363d; --text:#e6edf3; --muted:#9198a1; --accent:#58a6ff; --track:#21262d;
    }
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .bg { fill:var(--bg); stroke:var(--border); }
    .title { font-size:16px; font-weight:600; fill:var(--text); }
    .value { font-size:24px; font-weight:700; fill:var(--accent); }
    .label { font-size:12px; fill:var(--muted); }
    .body { font-size:13px; fill:var(--text); }</style>
  <rect class="bg" x=".5" y=".5" width="439" height="135" rx="10"/>
  <text class="title" x="22" y="36" style="fill:var(--accent)">OPE</text>
  <text class="body" x="22" y="66">End-to-end 6D object pose estimation in crowded</text><text class="body" x="22" y="85">scenes.</text>
  <circle cx="27" cy="114" r="5" fill="#3572a5"/><text class="label" x="38" y="118">Python</text>
  <text class="label" x="418" y="118" text-anchor="end">3 stars</text>
</svg>
