<svg xmlns="http://www.w3.org/2000/svg" width="495" height="235" viewBox="0 0 495 235" role="img" aria-label="GitHub stats">
  <title>GitHub stats</title>
  <style>
    :root { --bg:#ffffff; --border:#d0d7de; --text:#1f2328; --muted:#59636e; --accent:#0969da; --track:#eff2f5;
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --border:#30363d; --text:#e6edf3; --muted:#9198a1; --accent:#58a6ff; --track:#21262d;
    }
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .bg { fill:var(--bg); stroke:var(--border); }
    .title { font-size:16px; font-weight:600; fill:var(--text); }
    .value { font-size:24px; font-weight:700; fill:var(--accent); }
    .label { font-size:12px; fill:var(--muted); }
    .body { font-size:13px; fill:var(--text); }</style>
  <rect class="bg" x=".5" y=".5" width="494" height="234" rx="10"/>
  <text class="title" x="24" y="34">GitHub stats</text>
  <g><text class="value" x="24" y="90">38</text><text class="label" x="24" y="108">public repositories</text></g>
  <g><text class="value" x="254" y="90">37</text><text class="label" x="254" y="108">stars earned</text></g>
  <g><text class="value" x="24" y="170">65</text><text class="label" x="24" y="188">followers</text></g>
  <g><text class="value" x="254" y="170">111</text><text class="label" x="254" y="188">following</text></g>
</svg>
